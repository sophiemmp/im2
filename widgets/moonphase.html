<section class="moon-card" aria-label="Moon statistics">
    <aside class="phase-label">
      <h1>Waning Gibbous</h1>
      <div class="divider"></div>
    </aside>

    <main class="content">
      <h2 class="title">Stats</h2>

      <div class="stats-grid">
        <article class="stat">
          <h3 class="stat-title">Age</h3>
          <div class="value">
            <span class="number" id="age-days">17.5</span>
            <span class="unit">Days</span>
          </div>
        </article>

        <article class="stat">
          <h3 class="stat-title">Distance to Earth</h3>
          <div class="value">
            <span class="number" id="distance-earth">384’373</span>
            <span class="unit">km</span>
          </div>
        </article>

        <article class="stat">
          <h3 class="stat-title">Next Fullmoon</h3>
          <div class="event-row">
            <span class="moon-icon light" aria-hidden="true"></span>
            <div>
              <div class="value">
                <span class="number" id="fullmoon-days">9.5</span>
                <span class="unit">Days</span>
              </div>
              <div class="date" id="fullmoon-date">17.05.2026</div>
            </div>
          </div>
        </article>

        <article class="stat">
          <h3 class="stat-title">Next Eclipse</h3>
          <div class="event-row">
            <span class="moon-icon dark" aria-hidden="true"></span>
            <div>
              <div class="value">
                <span class="number" id="eclipse-days">178</span>
                <span class="unit">Days</span>
              </div>
              <div class="date" id="eclipse-date">11.01.2027</div>
            </div>
          </div>
        </article>
      </div>
    </main>
  </section>
