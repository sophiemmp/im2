<section class="moon-card" aria-label="Moon statistics">
	<aside class="phase-label">
		<h1>Waning Gibbous</h1>
		<div class="divider"></div>
	</aside>

	<div class="content">
		<h2 class="title">Stats</h2>

		<div class="stats-grid">
			<div class="stat">
				<h3 class="stat-title">Age</h3>
				<div class="value">
					<span class="number" id="age-days"></span>
					<span class="unit">Days</span>
				</div>
			</div>

			<div class="stat">
				<h3 class="stat-title">Distance to Earth</h3>
				<div class="value">
					<span class="number" id="distance-earth"></span>
					<span class="unit">km</span>
				</div>
			</div>

			<div class="stat">
				<h3 class="stat-title">Next Fullmoon</h3>
				<div class="event-row">
					<span class="moon-icon light" aria-hidden="true"></span>
					<div>
						<div class="value">
							<span class="number" id="fullmoon-days"></span>
							<span class="unit">Days</span>
						</div>
						<div class="date" id="fullmoon-date"></div>
					</div>
				</div>
			</div>

			<div class="stat">
				<h3 class="stat-title">Next Eclipse</h3>
				<div class="event-row">
					<span class="moon-icon dark" aria-hidden="true"></span>
					<div>
						<div class="value">
							<span class="number" id="eclipse-days"></span>
							<span class="unit">Days</span>
						</div>
						<div class="date" id="eclipse-date"></div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
