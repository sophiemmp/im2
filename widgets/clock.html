<section class="time-box">
	<div class="content clock-content">
		<div class="clock">
			<span id="hours">00</span>
			:
			<span id="minutes">00</span>
			:
			<span id="seconds">00</span>
		</div>

		<div class="date-row">
			<div>
				<h4>YEAR</h4>
				<p id="year"></p>
			</div>
			<div>
				<h4>MONTH</h4>
				<p id="month"></p>
			</div>
			<div>
				<h4>DAY</h4>
				<p id="day"></p>
			</div>
		</div>

		<div class="timezone">
			<h4>TIMEZONE</h4>
			<p id="timezone">Bern</p>
		</div>
	</div>
</section>
