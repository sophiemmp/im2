<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Behind the moon</title>
	<link rel="icon" type="image/x-icon" href="assets/images/moon.png">

    <link rel="stylesheet" href="css/style.css">
    <link href="https://api.fontshare.com/v2/css?f[]=space-grotesk@300,400,500,600,700,1&display=swap" rel="stylesheet">
</head>

<body>

    <section class="moon-card" aria-label="Moon statistics">
    <aside class="phase-label">
      <h1>Waning Gibbous</h1>
      <div class="divider"></div>
    </aside>

    <main class="content">
      <h2 class="title">Stats</h2>

      <div class="stats-grid">
        <article class="stat">
          <h3 class="stat-title">Age</h3>
          <div class="value">
            <span class="number">17.5</span>
            <span class="unit">Days</span>
          </div>
        </article>

        <article class="stat">
          <h3 class="stat-title">Distance to Earth</h3>
          <div class="value">
            <span class="number">384’373</span>
            <span class="unit">km</span>
          </div>
        </article>

        <article class="stat">
          <h3 class="stat-title">Next Fullmoon</h3>
          <div class="event-row">
            <span class="moon-icon light" aria-hidden="true"></span>
            <div>
              <div class="value">
                <span class="number">9.5</span>
                <span class="unit">Days</span>
              </div>
              <div class="date">17.05.2026</div>
            </div>
          </div>
        </article>

        <article class="stat">
          <h3 class="stat-title">Next Eclipse</h3>
          <div class="event-row">
            <span class="moon-icon dark" aria-hidden="true"></span>
            <div>
              <div class="value">
                <span class="number">178</span>
                <span class="unit">Days</span>
              </div>
              <div class="date">11.01.2027</div>
            </div>
          </div>
        </article>
      </div>
    </main>
  </section>


</body>

</html>
